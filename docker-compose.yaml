version: "3.8"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Mount local source code into the container for hot-reloading
      - .:/app
      # Exclude node_modules from the mount to use the ones inside the container
      - /app/node_modules
    environment:
      # --- Application Settings ---
      # Uses the host's NODE_ENV, or defaults to "development"
      NODE_ENV: ${NODE_ENV:-development}
      # It's recommended to set this secret in your host environment for production
      TOTP_SECRET_ENCRYPTION_KEY: ${TOTP_SECRET_ENCRYPTION_KEY:-t0tvpe3jCyxyGODCIn6WmxQNYFStu+clqOWu0OkKQLo=}

      # --- Security - AWS Cognito & OAuth2 ---
      # For development, these defaults point to localhost. Override if needed.
      NEXT_PUBLIC_OAUTH2_CALLBACK_URL: ${NEXT_PUBLIC_OAUTH2_CALLBACK_URL:-http://localhost:3000/api/v1/auth/callback/oidc}
      NEXT_PUBLIC_PASSKEY_CALLBACK_URL: ${NEXT_PUBLIC_PASSKEY_CALLBACK_URL:-http://localhost:3000/api/v1/auth/callback/passkey}
      NEXT_PUBLIC_OAUTH2_SCOPE: ${NEXT_PUBLIC_OAUTH2_SCOPE:-openid profile email aws.cognito.signin.user.admin}

      # !! These secrets MUST be set in your host environment !!
      # Example: export NEXT_PUBLIC_COGNITO_CLIENT_ID="your-client-id"
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET}
      NEXT_PUBLIC_COGNITO_WELLKNOWN: ${NEXT_PUBLIC_COGNITO_WELLKNOWN}

      # --- Admin Settings ---
      NEXT_PUBLIC_ADMIN_DASHBOARD_URL: ${NEXT_PUBLIC_ADMIN_DASHBOARD_URL}
      COGNITO_ADMIN_GROUP_NAME: ${COGNITO_ADMIN_GROUP_NAME:-admin}
      COGNITO_GROUPS_CLAIM_KEY: ${COGNITO_GROUPS_CLAIM_KEY:-cognito:groups}

      # --- Cloudflare R2 / S3-compatible storage ---
      # !! These secrets MUST be set in your host environment !!
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}

      # --- AWS General ---
      AWS_REGION: ${AWS_REGION:-sa-east-1}
