version: '3.8'

services:
  # Development service with hot-reload
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      # Mount local source code for hot-reloading
      - .:/app
      # Exclude node_modules to use container's version
      - /app/node_modules
    environment:
      NODE_ENV: development
      APP_URL: ${APP_URL:-http://localhost:3000}
      TOTP_SECRET_ENCRYPTION_KEY: ${TOTP_SECRET_ENCRYPTION_KEY:-t0tvpe3jCyxyGODCIn6WmxQNYFStu+clqOWu0OkKQLo=}

      # Cognito & OAuth2
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET}
      NEXT_PUBLIC_COGNITO_WELLKNOWN: ${NEXT_PUBLIC_COGNITO_WELLKNOWN}
      NEXT_PUBLIC_OAUTH2_SCOPE: ${NEXT_PUBLIC_OAUTH2_SCOPE:-openid profile email aws.cognito.signin.user.admin}

      # Admin settings
      COGNITO_ADMIN_GROUP_NAME: ${COGNITO_ADMIN_GROUP_NAME:-admins}
      COGNITO_GROUPS_CLAIM_KEY: ${COGNITO_GROUPS_CLAIM_KEY:-cognito:groups}
      NEXT_PUBLIC_ADMIN_DASHBOARD_URL: ${NEXT_PUBLIC_ADMIN_DASHBOARD_URL}

      # AWS & R2 Storage
      AWS_REGION: ${AWS_REGION:-us-east-1}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}

      # Email settings
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      CONTACT_FORM_TO_EMAIL: ${CONTACT_FORM_TO_EMAIL}

      # Caching Provider
      CACHE_PROVIDER: ${CACHE_PROVIDER:-upstash}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}

      # Log Level
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    restart: unless-stopped
    profiles: ['dev']

  # Production service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      TOTP_SECRET_ENCRYPTION_KEY: ${TOTP_SECRET_ENCRYPTION_KEY}

      # Cognito & OAuth2 (REQUIRED)
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET}
      NEXT_PUBLIC_COGNITO_WELLKNOWN: ${NEXT_PUBLIC_COGNITO_WELLKNOWN}
      NEXT_PUBLIC_OAUTH2_SCOPE: ${NEXT_PUBLIC_OAUTH2_SCOPE:-openid profile email aws.cognito.signin.user.admin}

      # Admin settings
      COGNITO_ADMIN_GROUP_NAME: ${COGNITO_ADMIN_GROUP_NAME:-admins}
      COGNITO_GROUPS_CLAIM_KEY: ${COGNITO_GROUPS_CLAIM_KEY:-cognito:groups}
      NEXT_PUBLIC_ADMIN_DASHBOARD_URL: ${NEXT_PUBLIC_ADMIN_DASHBOARD_URL}

      # AWS & R2 Storage (REQUIRED)
      AWS_REGION: ${AWS_REGION}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}

      # Email settings
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      CONTACT_FORM_TO_EMAIL: ${CONTACT_FORM_TO_EMAIL}

      # Caching Provider
      CACHE_PROVIDER: ${CACHE_PROVIDER:-upstash}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      
      # Log Level
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NEXT_TELEMETRY_DISABLED: 1
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http = require('http'); const options = { host: 'localhost', port: 3000, path: '/', timeout: 2000 }; const req = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: ['prod']

volumes:
  redis_data:
